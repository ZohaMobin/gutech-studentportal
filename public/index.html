    <title>Student Portal</title>
      <script>
      // A browser extension (chrome-extension://.../executors/200.js) hooks XMLHttpRequest and throws
      // "Cannot read properties of undefined (reading 'M_ID')". It is not an app error, but the dev
      // overlay shows it over the page. This runs before the bundle so its capture listener is first;
      // only errors from an extension file with this exact message are swallowed.
      window.addEventListener(
        'error',
        function (event) {
          var fromExtension = event.filename && event.filename.indexOf('chrome-extension://') === 0;
          var known = event.message && event.message.indexOf("Cannot read properties of undefined (reading 'M_ID')") !== -1;
          if (fromExtension && known) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        },
        true
      );
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  
  </body>
